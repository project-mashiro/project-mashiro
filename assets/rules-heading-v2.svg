<svg xmlns="http://www.w3.org/2000/svg" width="960" height="104" viewBox="0 0 960 104" role="img" aria-labelledby="t d"><title id="t">Shrine etiquette. My house, my rules.</title><desc id="d">A cream-toned section heading with a little waving tail.</desc><style>text{font-family:'Trebuchet MS',Verdana,sans-serif;fill:#392348}.ink{fill:#392348}.sub{fill:#705b7e}.white{fill:#fff4fb}.label{font-size:12px;font-weight:700;letter-spacing:2px}.body{font-size:20px}.title{font-weight:900;letter-spacing:-1px}.float{animation:float 5.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.tilt{animation:tilt 6.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.enter{animation:enter .4s cubic-bezier(.05,.7,.1,1) both}.nudge{animation:nudge 5s cubic-bezier(.38,1.21,.22,1) infinite;transform-box:fill-box;transform-origin:center}.d2{animation-delay:-1.7s}.d3{animation-delay:-3.4s}@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}@keyframes tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{transform:scale(.92);opacity:.65}50%{transform:scale(1.07);opacity:1}}@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes nudge{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.07)}90%{transform:scale(.98)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="960" height="104" rx="30" fill="#fff0cc"/><text x="32" y="65" font-size="46" class="title">Shrine etiquette.</text><rect x="699" y="37" width="229" height="31" rx="17" fill="#efcf84"/><text x="813.5" y="58" font-size="12" class="" style="fill:#392348" text-anchor="middle">MY HOUSE. MY RULES.</text><path class="tilt" d="M620 64c31 0 30-46 7-40-19 5 10 26 19 9" fill="none" stroke="#bb8bce" stroke-width="9" stroke-linecap="round"/></svg>