<svg xmlns="http://www.w3.org/2000/svg" width="464" height="110" viewBox="0 0 464 110" role="img" aria-labelledby="t d"><title id="t">The quiet corner. Open the still welcome artwork.</title><desc id="d">Tonal lilac M3 link card with a still waveform button.</desc><style>text{font-family:'Trebuchet MS',Verdana,sans-serif;fill:#392348}.ink{fill:#392348}.sub{fill:#705b7e}.white{fill:#fff4fb}.label{font-size:12px;font-weight:700;letter-spacing:2px}.body{font-size:20px}.title{font-weight:900;letter-spacing:-1px}.float{animation:float 5.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.tilt{animation:tilt 6.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.enter{animation:enter .4s cubic-bezier(.05,.7,.1,1) both}.nudge{animation:nudge 5s cubic-bezier(.38,1.21,.22,1) infinite;transform-box:fill-box;transform-origin:center}.d2{animation-delay:-1.7s}.d3{animation-delay:-3.4s}@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}@keyframes tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{transform:scale(.92);opacity:.65}50%{transform:scale(1.07);opacity:1}}@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes nudge{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.07)}90%{transform:scale(.98)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="464" height="110" rx="30" fill="#eee3f8"/><text x="29" y="45" font-size="11" class="label" style="fill:#705b7e">A SOFTER LITTLE HELLO</text><text x="29" y="81" font-size="27" class="title">The quiet corner.</text><rect x="378" y="23" width="64" height="64" rx="23" fill="#d9c1ee"/><g stroke="#705b7e" stroke-width="3" stroke-linecap="round"><path d="M396 48v14m10-23v32m10-23v14m10-18v22"/></g></svg>